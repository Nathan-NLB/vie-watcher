name: Veille offres VIE

on:
  schedule:
    # Une fois par heure (minute 17 pour éviter l'engorgement des runners
    # à l'heure pile).
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: vie-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Vérifier les nouvelles offres et notifier
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CANDIDATE_PROFILE: ${{ secrets.CANDIDATE_PROFILE }}
        run: node scripts/check-offers.mjs

      - name: Enregistrer les changements
        run: |
          git config user.name "vie-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          # On n'enregistre que si de nouvelles offres ont été trouvées
          # (data/seen-ids.json modifié). Sinon, seul l'horodatage de la page
          # changerait : pas de commit, donc pas de déploiement de la page.
          if git diff --quiet -- data/seen-ids.json; then
            echo "Aucune nouvelle offre, rien à enregistrer."
            exit 0
          fi
          git add data/ README.md docs/
          if ! git diff --cached --quiet; then
            git commit -m "Mise à jour automatique des offres VIE"
            for i in 1 2 3 4 5; do
              if git push; then
                exit 0
              fi
              echo "Push refusé (tentative $i/5), on réintègre les derniers changements et on réessaie..."
              git pull --rebase origin "$GITHUB_REF_NAME"
              sleep 3
            done
            echo "Échec du push après 5 tentatives."
            exit 1
          else
            echo "Aucun changement à enregistrer."
          fi
